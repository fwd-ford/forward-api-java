# Runtime configuration. Every value can be overridden via environment variables.
# Configuracao de runtime. Todos os valores podem ser sobrescritos por variaveis de ambiente.
#
# Profiles:
#   (default)  PostgreSQL from DATABASE_URL, Flyway applies db/migration only.
#   demo       Embedded PostgreSQL 16 (no Docker) + migrations + demo seed.
#   seed       Adds the demo seed to an external PostgreSQL (use with an empty database).
#   test       Used by the automated tests (embedded PostgreSQL + seed, fixed JWT secret).
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

spring:
  application:
    name: forward-api
  lifecycle:
    timeout-per-shutdown-phase: 10s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/forward_api?sslmode=disable}
    username: ${DATABASE_USER:forward}
    password: ${DATABASE_PASSWORD:forward_dev}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 2
      max-lifetime: 1800000
      idle-timeout: 300000
      connection-test-query: SELECT 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  jackson:
    # Every JSON payload (requests and responses) uses snake_case.
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    io.zonky.test.db.postgres: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

forward:
  env: ${ENV:development}
  version: "@project.version@"
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
  rate-limit:
    max: ${RATE_LIMIT_MAX:60}
    window: ${RATE_LIMIT_WINDOW:1m}
    login-max: ${LOGIN_RATE_LIMIT_MAX:5}
    login-window: ${LOGIN_RATE_LIMIT_WINDOW:1m}
  jwt:
    # HS256 signing key, at least 32 bytes. Mandatory when ENV=production.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    issuer: forward-api
    audience: forward-app
    clock-skew-seconds: 30
  internal-api-key: ${INTERNAL_API_KEY:}
  # Header set by a trusted reverse proxy with the real client IP (Fly.io: Fly-Client-IP).
  # Empty = use the socket address. Never point this at a header clients can forge.
  trusted-client-ip-header: ${TRUSTED_CLIENT_IP_HEADER:}
  max-body-bytes: ${MAX_BODY_BYTES:1048576}
  # Log format consumed by logback-spring.xml: JSON or CONSOLE.
  # LOG_FORMAT wins; otherwise ENV=production switches to JSON.
  log-format: ${LOG_FORMAT:${forward.log-format-by-env.${ENV:development}:CONSOLE}}
  log-format-by-env:
    production: JSON
