openapi: 3.0.1
info:
  title: ForwardService API
  description: |
    API REST (nível 2 de maturidade de Richardson) e SOAP do **ForwardService**, a plataforma de retenção de clientes da rede Ford (Challenge Ford x FIAP 2026).

    ## Autenticação (JWT)
    1. `POST /api/v1/auth/login` com `{"email": "...", "password": "..."}` (endpoint público).
    2. Copie o `access_token` da resposta (JWT HS256, validade de 60 minutos).
    3. Envie `Authorization: Bearer <access_token>` em todas as outras chamadas (no Swagger UI, botão **Authorize**).

    Claims do token: `iss=forward-api`, `aud=forward-app`, `sub` (id do usuário), `email`, `name`, `role`, `dealer_id`, `token_version`, `iat`, `exp`, `jti`. A cada requisição a API confere o token com o estado atual do usuário: se ele foi desativado, excluído, mudou de perfil ou de concessionária (ou teve a senha redefinida), o token antigo recebe `401 AUTH_TOKEN_REVOKED` antes mesmo de expirar. Chamadas servidor-a-servidor (n8n) podem usar o header `X-API-Key`.

    ## Perfis
    | Perfil | Escopo |
    |---|---|
    | ATENDENTE | Leads, clientes e veículos da própria concessionária; atualiza leads. |
    | GESTOR | Tudo do ATENDENTE + cria e altera eventos de serviço da concessionária. |
    | ADMIN | Todas as concessionárias, exclui eventos de serviço e administra usuários. |

    ## Usuários de demonstração (perfis `prod` e `demo`)
    Senha de todos: `Forward@2026`

    | E-mail | Perfil | Concessionária |
    |---|---|---|
    | admin@forward.dev | ADMIN | todas |
    | gestor@forward.dev | GESTOR | F0001 Ford Morumbi São Paulo |
    | atendente@forward.dev | ATENDENTE | F0001 Ford Morumbi São Paulo |
    | atendente2@forward.dev | ATENDENTE | F0002 Ford Barra Rio |

    ## Erros
    Todo erro segue a RFC 7807 (`application/problem+json`) com os campos `type`, `title`, `status`, `detail`, `instance`, `code`, `timestamp` e `request_id` (mensagens em pt-BR). Listas retornam o total no header `X-Total-Count`. Limite de requisições por IP com resposta `429` e header `Retry-After`.
  contact:
    name: Forward Team (FIAP)
    url: https://github.com/fwd-ford/forward-api-java
  version: 3.0.0
externalDocs:
  description: "README, arquitetura e matriz de permissões"
  url: https://github.com/fwd-ford/forward-api-java#readme
servers:
- url: https://forward-api-java.onrender.com
  description: Produção (Render + Supabase)
- url: http://localhost:8080
  description: Local (perfil demo)
security:
- bearerAuth: []
- apiKey: []
tags:
- name: Users
  description: Administração de usuários (somente ADMIN).
- name: Me
  description: Usuário autenticado.
- name: Vehicles
  description: Veículos por VIN (escopo por concessionária).
- name: Health
  description: Liveness and readiness probes (public).
- name: Auth
  description: "Autenticação: login com e-mail e senha, emissão de JWT."
- name: Service Events
  description: "Eventos de serviço (revisões, recalls, reparos). Leitura: todos os\
    \ perfis; escrita: GESTOR e ADMIN; exclusão: ADMIN."
- name: Leads
  description: Leads de retenção (escopo por concessionária).
- name: Customers
  description: Clientes e score de churn (escopo por concessionária).
paths:
  /api/v1/service-events/{id}:
    get:
      tags:
      - Service Events
      summary: Evento de serviço por id
      operationId: getServiceEvent
      parameters:
      - name: id
        in: path
        description: UUID do evento.
        required: true
        schema:
          type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: Evento encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceEvent"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
    put:
      tags:
      - Service Events
      summary: Substituir evento de serviço
      description: "PUT com a representação completa (mesmo corpo do POST, status\
        \ opcional). Mesmas regras de perfil e validação do POST; id inexistente responde\
        \ 404."
      operationId: replaceServiceEvent
      parameters:
      - name: id
        in: path
        description: UUID do evento.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceEventRequest"
        required: true
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "200":
          description: Evento atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceEvent"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags:
      - Service Events
      summary: Excluir evento de serviço
      description: Somente ADMIN. Responde 204 sem corpo.
      operationId: deleteServiceEvent
      parameters:
      - name: id
        in: path
        description: UUID do evento.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Evento excluído
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/users:
    get:
      tags:
      - Users
      summary: Listar usuários
      description: Somente ADMIN. Total no header X-Total-Count.
      operationId: listUsers
      parameters:
      - name: role
        in: query
        description: Filtra por perfil.
        required: false
        schema:
          type: string
          enum:
          - ATENDENTE
          - GESTOR
          - ADMIN
      - name: active
        in: query
        description: Filtra por ativo/inativo.
        required: false
        schema:
          type: boolean
      - name: dealer_id
        in: query
        description: Filtra por concessionária.
        required: false
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          maximum: 200
          minimum: 1
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          minimum: 0
          type: integer
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "200":
          description: Página de usuários
          headers:
            X-Total-Count:
              description: Total de usuários que atendem aos filtros
              style: simple
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      tags:
      - Users
      summary: Criar usuário
      description: "Somente ADMIN. E-mail duplicado: 409 USER_EMAIL_TAKEN. Senha fraca:\
        \ 400. Concessionária inexistente: 422. ATENDENTE e GESTOR exigem dealer_id."
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        "201":
          description: Usuário criado
          headers:
            Location:
              description: URL do novo recurso
              style: simple
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/v1/service-events:
    get:
      tags:
      - Service Events
      summary: Listar eventos de serviço
      description: Todos os perfis. ATENDENTE e GESTOR veem apenas eventos da própria
        concessionária. Total no header X-Total-Count.
      operationId: listServiceEvents
      parameters:
      - name: vin
        in: query
        description: Filtra por VIN.
        required: false
        schema:
          type: string
        example: 9BFZZZ5SZJB000001
      - name: limit
        in: query
        description: "Tamanho da página (1 a 200, padrão 50)."
        required: false
        schema:
          maximum: 200
          minimum: 1
          type: integer
      - name: offset
        in: query
        description: Deslocamento (padrão 0).
        required: false
        schema:
          minimum: 0
          type: integer
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "200":
          description: Página de eventos
          headers:
            X-Total-Count:
              description: Total de eventos que atendem aos filtros
              style: simple
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags:
      - Service Events
      summary: Registrar evento de serviço
      description: "GESTOR (somente a própria concessionária), ADMIN ou integraçã\
        o (X-API-Key). Responde 201 com o recurso e o header Location. VIN ou concessioná\
        ria inexistentes: 422. Evento duplicado (mesmo VIN, concessionária, tipo e\
        \ data): 409."
      operationId: createServiceEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceEventRequest"
        required: true
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Evento criado
          headers:
            Location:
              description: URL do novo recurso
              style: simple
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login (emite JWT)
      description: "Endpoint público. Valida e-mail e senha (BCrypt) e devolve um\
        \ JWT HS256 com validade de 60 minutos (JWT_EXPIRATION_MINUTES). Use o token\
        \ no header `Authorization: Bearer <access_token>`. E-mail inexistente e senha\
        \ errada devolvem a mesma resposta 401 AUTH_INVALID_CREDENTIALS. Limite: 5\
        \ tentativas por minuto por IP (429)."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "200":
          description: Login realizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
      security: []
  /api/v1/users/{id}:
    get:
      tags:
      - Users
      summary: Usuário por id
      description: Somente ADMIN.
      operationId: getUser
      parameters:
      - name: id
        in: path
        description: UUID do usuário.
        required: true
        schema:
          type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "200":
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags:
      - Users
      summary: Excluir usuário
      description: "Somente ADMIN. Responde 204. Excluir a própria conta: 409 USER_SELF_DELETE."
      operationId: deleteUser
      parameters:
      - name: id
        in: path
        description: UUID do usuário.
        required: true
        schema:
          type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "204":
          description: Usuário excluído
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
    patch:
      tags:
      - Users
      summary: Atualizar usuário
      description: "Somente ADMIN. Campos opcionais: name, role, active, dealer_id,\
        \ password. O ADMIN não pode alterar o próprio perfil nem desativar a pró\
        pria conta (409)."
      operationId: updateUser
      parameters:
      - name: id
        in: path
        description: UUID do usuário.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/leads/{id}:
    get:
      tags:
      - Leads
      summary: Detalhe do lead
      description: "Inclui dados do cliente, do veículo, da concessionária e do score\
        \ de churn. Lead de outra concessionária resulta em 403 ACCESS_OTHER_DEALER."
      operationId: getLead
      parameters:
      - name: id
        in: path
        description: UUID do lead.
        required: true
        schema:
          type: string
        example: a1000000-0000-4000-8000-000000000001
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "200":
          description: Lead encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
    patch:
      tags:
      - Leads
      summary: Atualizar status e/ou notas do lead
      description: "Atualização parcial (idempotente para o mesmo status). Transiç\
        ões válidas: new -> assigned|contacted|lost; assigned -> contacted|lost; contacted\
        \ -> converted|lost. Status finais (converted, lost, expired) respondem 409\
        \ LEAD_INVALID_TRANSITION. Status desconhecido responde 400. Toda alteraçã\
        o é registrada no audit_log."
      operationId: patchLead
      parameters:
      - name: id
        in: path
        description: UUID do lead.
        required: true
        schema:
          type: string
        example: a1000000-0000-4000-8000-000000000001
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadPatchRequest"
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/LeadPatchRequest"
        required: true
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "200":
          description: Lead atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
  /ready:
    get:
      tags:
      - Health
      summary: Readiness probe
      description: Public endpoint that confirms the process is ready to serve traffic
        and returns the running version. Does not test downstream dependencies.
      operationId: readiness
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
      security: []
  /health:
    get:
      tags:
      - Health
      summary: Liveness probe
      description: Public endpoint that confirms the process is up and returns the
        running version. Does not test downstream dependencies.
      operationId: liveness
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
      security: []
  /api/v1/vehicles/{vin}:
    get:
      tags:
      - Vehicles
      summary: Veículo por VIN
      description: "VIN de 17 caracteres (ISO 3779, sem I, O e Q). ATENDENTE e GESTOR\
        \ só enxergam veículos da própria concessionária; ADMIN vê todos."
      operationId: getVehicle
      parameters:
      - name: vin
        in: path
        description: "VIN de 17 caracteres (ISO 3779, sem I/O/Q)."
        required: true
        schema:
          pattern: "^[A-HJ-NPR-Z0-9]{17}$"
          type: string
        example: 9BFZZZ5SZJB000001
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "200":
          description: Veículo encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/scores/{customerId}:
    get:
      tags:
      - Customers
      summary: Score de churn (alias deprecado)
      description: "Alias mantido por compatibilidade. Use GET /api/v1/customers/{id}/score.\
        \ A resposta inclui os headers `Deprecation: true` e `Link` com rel=\"successor-version\"\
        ."
      operationId: getCurrentChurnScoreDeprecated
      parameters:
      - name: customerId
        in: path
        description: UUID do cliente.
        required: true
        schema:
          type: string
        example: 11111111-1111-1111-1111-111111111001
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Score encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurnScore"
        "400":
          $ref: "#/components/responses/BadRequest"
      deprecated: true
  /api/v1/me:
    get:
      tags:
      - Me
      summary: Usuário autenticado
      description: "Retorna o usuário dono do token (todos os perfis), com a concessioná\
        ria e a lista de permissões derivadas do perfil. Útil para o app montar a\
        \ interface."
      operationId: me
      responses:
        "200":
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/leads:
    get:
      tags:
      - Leads
      summary: Listar leads
      description: "Todos os perfis. ATENDENTE e GESTOR recebem apenas leads da pró\
        pria concessionária (dealer_id de outra concessionária resulta em 403); ADMIN\
        \ vê todas e pode filtrar por dealer_id. Ordenado por created_at desc. Corpo:\
        \ array JSON; total no header X-Total-Count."
      operationId: listLeads
      parameters:
      - name: status
        in: query
        description: Filtra por status.
        required: false
        schema:
          type: string
          enum:
          - new
          - assigned
          - contacted
          - converted
          - lost
          - expired
      - name: priority
        in: query
        description: Filtra por prioridade.
        required: false
        schema:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
      - name: dealer_id
        in: query
        description: Filtra por concessionária (ADMIN; demais perfis só a própria).
        required: false
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: "Tamanho da página (1 a 200, padrão 50)."
        required: false
        schema:
          maximum: 200
          minimum: 1
          type: integer
      - name: offset
        in: query
        description: Deslocamento para paginação (padrão 0).
        required: false
        schema:
          minimum: 0
          type: integer
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "200":
          description: Página de leads (pode ser vazia)
          headers:
            X-Total-Count:
              description: Total de leads que atendem aos filtros
              style: simple
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/customers/{id}:
    get:
      tags:
      - Customers
      summary: Cliente por id
      description: Todos os perfis. ATENDENTE e GESTOR só enxergam clientes vinculados
        à própria concessionária (veículo atendido ou lead da concessionária); ADMIN
        vê todos.
      operationId: getCustomer
      parameters:
      - name: id
        in: path
        description: UUID do cliente.
        required: true
        schema:
          type: string
        example: 11111111-1111-1111-1111-111111111001
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/customers/{id}/score:
    get:
      tags:
      - Customers
      summary: Score de churn atual do cliente
      description: "Último score calculado pelo forward-ml para o cliente. Mesmas\
        \ regras de escopo de GET /api/v1/customers/{id}. 404 SCORE_NOT_FOUND quando\
        \ não há score."
      operationId: getCustomerScore
      parameters:
      - name: id
        in: path
        description: UUID do cliente.
        required: true
        schema:
          type: string
        example: 11111111-1111-1111-1111-111111111001
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Score encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurnScore"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  schemas:
    ApiProblem:
      type: object
      properties:
        type:
          type: string
          description: URI que identifica o tipo do problema.
          example: urn:forward:problem:access-other-dealer
        title:
          type: string
          description: Resumo do problema (pt-BR).
          example: Acesso negado
        status:
          type: integer
          description: Status HTTP.
          format: int32
          example: 403
        detail:
          type: string
          description: Explicação para o usuário (pt-BR).
          example: Este recurso pertence a outra concessionária.
        instance:
          type: string
          description: Caminho da requisição.
          example: /api/v1/leads/a1000000-0000-4000-8000-000000000009
        code:
          type: string
          description: Código estável do erro.
          example: ACCESS_OTHER_DEALER
        timestamp:
          type: string
          description: Instante do erro (UTC).
          example: 2026-09-27T12:00:00Z
        request_id:
          type: string
          description: Id de correlação (header X-Request-Id).
          example: 5b0c7a4e-8f1d-4c1e-9a55-2f4d7e9b1c33
        errors:
          type: array
          description: Erros por campo (somente em VALIDATION_FAILED).
          nullable: true
          items:
            $ref: "#/components/schemas/FieldProblem"
      description: Erro no formato RFC 7807 (application/problem+json). Todo erro
        da API segue este formato; 'code' é estável e pode ser usado pelo cliente.
    FieldProblem:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    ServiceEventRequest:
      required:
      - dealer_code
      - main_source
      - maintenance_number
      - service_code
      - service_date
      - vin
      type: object
      properties:
        vin:
          type: string
          description: VIN de 17 caracteres (ISO 3779).
          example: 9BFZZZ5SZJB000011
        dealer_code:
          maxLength: 20
          minLength: 0
          type: string
          description: Código da concessionária.
          example: F0001
        service_code:
          maximum: 5
          minimum: 1
          type: integer
          description: "Tipo: 1 revisão programada, 2 recall, 3 reparo em garantia,\
            \ 4 reparo pago, 5 inspeção."
          format: int32
          example: 1
        maintenance_number:
          minimum: 0
          type: integer
          description: Número da revisão (0 = fora do plano).
          format: int32
          example: 3
        km:
          minimum: 0
          type: integer
          description: Quilometragem no serviço.
          format: int32
          nullable: true
          example: 42500
        service_date:
          type: string
          description: Data e hora do serviço (ISO 8601 com offset).
          format: date-time
          example: 2026-10-20T09:00:00-03:00
        main_source:
          pattern: ^(dealer_app|n8n|manual|legacy)$
          type: string
          description: Origem do evento.
          example: dealer_app
          enum:
          - dealer_app
          - n8n
          - manual
          - legacy
        status:
          pattern: ^(scheduled|in_progress|completed|cancelled|no_show)$
          type: string
          description: Situação (padrão scheduled).
          nullable: true
          example: scheduled
          enum:
          - scheduled
          - in_progress
          - completed
          - cancelled
          - no_show
      description: Dados de um evento de serviço.
    ServiceEvent:
      type: object
      properties:
        id:
          type: string
          description: UUID do evento.
          format: uuid
        vin:
          type: string
          description: VIN do veículo.
          example: 9BFZZZ5SZJB000001
        dealer_id:
          type: string
          description: UUID da concessionária.
          format: uuid
        dealer_code:
          type: string
          description: Código Ford da concessionária.
          example: F0001
        order_type:
          type: string
          description: Tipo do serviço.
          example: scheduled_maintenance
          enum:
          - scheduled_maintenance
          - recall
          - warranty_repair
          - paid_repair
          - inspection
        service_code:
          type: integer
          description: Código numérico do tipo (1 a 5).
          format: int32
          example: 1
        status:
          type: string
          description: Situação do evento.
          example: scheduled
          enum:
          - scheduled
          - in_progress
          - completed
          - cancelled
          - no_show
        scheduled_at:
          type: string
          description: Data e hora do serviço.
          format: date-time
        completed_at:
          type: string
          description: Conclusão (quando status = completed).
          format: date-time
        mileage_km:
          type: integer
          description: Quilometragem no serviço.
          format: int32
          example: 42500
        maintenance_number:
          type: integer
          description: Número da revisão (0 = fora do plano).
          format: int32
          example: 3
        main_source:
          type: string
          description: Origem do evento.
          example: dealer_app
          enum:
          - dealer_app
          - n8n
          - manual
          - legacy
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: "Evento de serviço (revisão, recall, reparo)."
    CreateUserRequest:
      required:
      - email
      - name
      - password
      - role
      type: object
      properties:
        email:
          maxLength: 254
          minLength: 0
          type: string
          example: marina.lopes@forward.dev
        name:
          maxLength: 120
          minLength: 0
          type: string
          example: Marina Lopes
        password:
          pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z0-9]).{8,72}$"
          type: string
          description: "Mínimo 8 caracteres, com letra maiúscula, minúscula, número\
            \ e símbolo."
          format: password
          example: Troca@2026
        role:
          pattern: ^(ATENDENTE|GESTOR|ADMIN)$
          type: string
          example: ATENDENTE
          enum:
          - ATENDENTE
          - GESTOR
          - ADMIN
        dealer_id:
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          type: string
          description: Obrigatório para ATENDENTE e GESTOR; ignorado para ADMIN.
          format: uuid
          nullable: true
          example: d0000000-0000-4000-8000-000000000001
      description: Dados para criar um usuário.
    User:
      type: object
      properties:
        id:
          type: string
          description: UUID do usuário.
          example: ad000000-0000-4000-8000-000000000003
        name:
          type: string
          description: Nome completo.
          example: Beatriz Santos
        email:
          type: string
          description: E-mail.
          example: atendente@forward.dev
        role:
          type: string
          description: Perfil de acesso.
          example: ATENDENTE
          enum:
          - ATENDENTE
          - GESTOR
          - ADMIN
        dealer_id:
          type: string
          description: Concessionária (null para ADMIN).
          nullable: true
        dealer_name:
          type: string
          description: Nome da concessionária.
          nullable: true
        active:
          type: boolean
          description: Usuário ativo (pode fazer login).
          example: true
        last_login_at:
          type: string
          description: Último login bem-sucedido.
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: Usuário da aplicação (nunca inclui o hash da senha).
    LoginRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          maxLength: 254
          minLength: 0
          type: string
          description: E-mail do usuário (sem diferenciar maiúsculas).
          example: gestor@forward.dev
        password:
          maxLength: 72
          minLength: 0
          type: string
          description: Senha do usuário.
          format: password
          example: Forward@2026
      description: Credenciais do usuário.
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: "JWT HS256 a ser enviado em Authorization: Bearer <token>."
        token_type:
          type: string
          description: Sempre Bearer.
          example: Bearer
        expires_in:
          type: integer
          description: Validade do token em segundos.
          format: int64
          example: 3600
        expires_at:
          type: string
          description: "Instante de expiração (ISO 8601, UTC)."
          format: date-time
        user:
          $ref: "#/components/schemas/UserSummary"
      description: Token de acesso emitido pela API.
    UserSummary:
      type: object
      properties:
        id:
          type: string
          description: UUID do usuário.
          example: ad000000-0000-4000-8000-000000000002
        name:
          type: string
          description: Nome completo.
          example: Gustavo Mendes
        email:
          type: string
          description: E-mail.
          example: gestor@forward.dev
        role:
          type: string
          description: Perfil de acesso.
          example: GESTOR
          enum:
          - ATENDENTE
          - GESTOR
          - ADMIN
        dealer_id:
          type: string
          description: Concessionária do usuário (null para ADMIN).
          nullable: true
          example: d0000000-0000-4000-8000-000000000001
        dealer_name:
          type: string
          description: Nome da concessionária (null para ADMIN).
          nullable: true
          example: Ford Morumbi São Paulo
      description: Dados básicos do usuário autenticado.
    UpdateUserRequest:
      type: object
      properties:
        name:
          maxLength: 120
          minLength: 1
          type: string
          nullable: true
          example: Beatriz Santos Lima
        role:
          pattern: ^(ATENDENTE|GESTOR|ADMIN)$
          type: string
          nullable: true
          enum:
          - ATENDENTE
          - GESTOR
          - ADMIN
        active:
          type: boolean
          description: false bloqueia o login do usuário.
          nullable: true
        dealer_id:
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          type: string
          format: uuid
          nullable: true
        password:
          pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z0-9]).{8,72}$"
          type: string
          description: "Nova senha (redefinição pelo ADMIN). Mínimo 8 caracteres,\
            \ com letra maiúscula, minúscula, número e símbolo."
          format: password
          nullable: true
        empty:
          type: boolean
      description: Campos alteráveis de um usuário.
    LeadPatchRequest:
      type: object
      properties:
        status:
          pattern: ^(new|assigned|contacted|converted|lost|expired)$
          type: string
          description: "Novo status. Transições: new -> assigned|contacted|lost; assigned\
            \ -> contacted|lost; contacted -> converted|lost. converted, lost e expired\
            \ são finais."
          nullable: true
          example: contacted
          enum:
          - new
          - assigned
          - contacted
          - converted
          - lost
          - expired
        notes:
          maxLength: 2000
          minLength: 0
          type: string
          description: Anotações do atendimento (máx. 2000 caracteres; "" limpa).
          nullable: true
          example: Cliente atendeu e pediu retorno amanhã às 10h.
      description: Atualização parcial de um lead (ao menos um campo).
    Lead:
      type: object
      properties:
        id:
          type: string
          description: UUID do lead.
          format: uuid
          example: a1000000-0000-4000-8000-000000000001
        customer_id:
          type: string
          description: UUID do cliente.
          format: uuid
          example: 11111111-1111-1111-1111-111111111001
        vin:
          pattern: "^[A-HJ-NPR-Z0-9]{17}$"
          type: string
          description: VIN do veículo (17 caracteres).
          example: 9BFZZZ5SZJB000001
        dealer_id:
          type: string
          description: UUID da concessionária responsável.
          format: uuid
          example: d0000000-0000-4000-8000-000000000001
        priority:
          type: string
          description: Prioridade.
          example: high
          enum:
          - low
          - medium
          - high
          - critical
        status:
          type: string
          description: Status no ciclo de vida.
          example: new
          enum:
          - new
          - assigned
          - contacted
          - converted
          - lost
          - expired
        reason:
          type: string
          description: Motivo da geração do lead.
          example: Revisão atrasada há 18 meses.
        expected_value_brl:
          minimum: 0
          type: number
          description: Receita esperada em BRL.
          format: double
          example: 1200.0
        created_at:
          type: string
          description: Criação do lead.
          format: date-time
        updated_at:
          type: string
          description: Última alteração.
          format: date-time
        converted_at:
          type: string
          description: Quando o lead virou venda (se convertido).
          format: date-time
        notes:
          type: string
          description: Anotações do atendimento.
          example: Cliente pediu retorno amanhã.
        customer_name:
          type: string
          description: Nome do cliente.
          example: João da Silva
        vehicle_model:
          type: string
          description: Modelo do veículo.
          example: Ka
        vehicle_year:
          type: integer
          description: Ano do veículo.
          format: int32
          example: 2018
        dealer_name:
          type: string
          description: Nome da concessionária.
          example: Ford Morumbi São Paulo
        churn_probability:
          type: number
          description: Probabilidade de churn (0 a 1).
          format: double
          example: 0.78
        segment:
          type: string
          description: Segmento comportamental.
          example: esquecido
          enum:
          - fiel
          - abandono
          - esquecido
          - economico
      description: Oportunidade de retenção gerada a partir do score de churn.
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          description: Always "ok" when the service is responsive.
          example: ok
        timestamp:
          type: string
          description: Server timestamp in ISO 8601.
          format: date-time
          example: 2026-05-24T19:00:00Z
        service:
          type: string
          description: Service identifier.
          example: forward-api
        version:
          type: string
          description: Running version (Maven artifact version).
          example: 0.1.0
      description: Health probe payload. Indicates the process is up and reports its
        version.
    Vehicle:
      type: object
      properties:
        vin:
          pattern: "^[A-HJ-NPR-Z0-9]{17}$"
          type: string
          description: 17-character Vehicle Identification Number (ISO 3779).
          example: 1HGCM82633A123456
        customer_id:
          type: string
          description: Owner's customer UUID.
          format: uuid
          example: 2ddd2b47-9a80-4a0c-8c0a-8ee35d6f8b10
        current_dealer_id:
          type: string
          description: Dealer currently responsible for the vehicle (nullable).
          format: uuid
          nullable: true
          example: d0000000-0000-4000-8000-000000000001
        model:
          type: string
          description: Commercial model name.
          example: Ranger
        year:
          minimum: 1900
          type: integer
          description: Model year.
          format: int32
          example: 2024
        version:
          type: string
          description: Trim or version of the model.
          example: Limited 3.0 V6
        color:
          type: string
          description: Exterior color.
          example: Azul Atlas
        discontinued:
          type: boolean
          description: True if the model is no longer in production.
          example: false
        purchase_date:
          type: string
          description: Date the customer purchased the vehicle.
          format: date
          example: 2023-08-14
        last_service_at:
          type: string
          description: Timestamp of the most recent service event for this vehicle.
          format: date-time
          example: 2026-04-22T13:05:00-03:00
      description: Vehicle record identified by VIN.
    ChurnScore:
      type: object
      properties:
        id:
          type: string
          description: Score UUID.
          format: uuid
          example: 5e1d2f3a-4b6c-4d7e-8f9a-0b1c2d3e4f50
        customer_id:
          type: string
          description: Customer UUID this score belongs to.
          format: uuid
          example: 2ddd2b47-9a80-4a0c-8c0a-8ee35d6f8b10
        vin:
          pattern: "^[A-HJ-NPR-Z0-9]{17}$"
          type: string
          description: VIN of the vehicle considered when computing the score (nullable).
          nullable: true
          example: 1HGCM82633A123456
        model_version:
          type: string
          description: Identifier of the ML model that produced this score.
          example: v1.3.0
        segment:
          type: string
          description: Behavioral segment inferred by the model.
          example: abandono
          enum:
          - fiel
          - abandono
          - esquecido
          - economico
        churn_probability:
          maximum: 1
          minimum: 0
          type: number
          description: "Predicted probability of churn in the next 90 days, in [0,\
            \ 1]."
          format: double
          example: 0.82
        confidence:
          maximum: 1
          minimum: 0
          type: number
          description: "Confidence of the prediction, in [0, 1] (nullable)."
          format: double
          nullable: true
          example: 0.91
        computed_at:
          type: string
          description: Timestamp the score was computed.
          format: date-time
          example: 2026-05-23T22:10:00-03:00
      description: Latest churn probability and behavioral segment computed for a
        customer.
    Me:
      type: object
      properties:
        id:
          type: string
          description: UUID do usuário ('service' para chamadas com X-API-Key).
          example: ad000000-0000-4000-8000-000000000003
        name:
          type: string
          description: Nome completo.
          example: Beatriz Santos
        email:
          type: string
          description: E-mail.
          nullable: true
          example: atendente@forward.dev
        role:
          type: string
          description: Perfil de acesso.
          example: ATENDENTE
          enum:
          - ATENDENTE
          - GESTOR
          - ADMIN
          - SERVICE
        dealer_id:
          type: string
          description: Concessionária do usuário (null para ADMIN e SERVICE).
          nullable: true
          example: d0000000-0000-4000-8000-000000000001
        dealer_name:
          type: string
          description: Nome da concessionária.
          nullable: true
          example: Ford Morumbi São Paulo
        permissions:
          type: array
          description: Permissões derivadas do perfil.
          items:
            type: string
            example: leads:read
      description: Usuário autenticado e suas permissões.
    Customer:
      type: object
      properties:
        id:
          type: string
          description: Customer UUID.
          format: uuid
          example: 2ddd2b47-9a80-4a0c-8c0a-8ee35d6f8b10
        full_name:
          type: string
          description: Customer full name.
          example: Maria Aparecida Silva
        email:
          type: string
          description: Customer email (RFC 5322).
          format: email
          example: maria.silva@example.com
        phone:
          type: string
          description: Phone number with country and area code.
          example: "+5511987654321"
        city:
          type: string
          description: City of residence.
          example: Sao Paulo
        state:
          maxLength: 2
          minLength: 2
          type: string
          description: Brazilian state abbreviation (UF).
          example: SP
        opt_in_whatsapp:
          type: boolean
          description: True when the customer accepted WhatsApp outreach.
          example: true
        created_at:
          type: string
          description: Timestamp the customer record was created.
          format: date-time
          example: 2025-09-12T18:34:00-03:00
      description: "Customer profile, returned with RBAC enforcement."
  responses:
    BadRequest:
      description: "Requisição inválida (validação, JSON malformado, parâmetro invá\
        lido)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
          example:
            type: urn:forward:problem:validation-failed
            title: Requisição inválida
            status: 400
            detail: Um ou mais campos são inválidos.
            instance: /api/v1/...
            code: VALIDATION_FAILED
            timestamp: 2026-09-27T12:00:00Z
            request_id: 5b0c7a4e-8f1d-4c1e-9a55-2f4d7e9b1c33
    InvalidCredentials:
      description: Credenciais inválidas ou usuário desativado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
          example:
            type: urn:forward:problem:auth-invalid-credentials
            title: Não autenticado
            status: 401
            detail: E-mail ou senha inválidos.
            instance: /api/v1/...
            code: AUTH_INVALID_CREDENTIALS
            timestamp: 2026-09-27T12:00:00Z
            request_id: 5b0c7a4e-8f1d-4c1e-9a55-2f4d7e9b1c33
    Unauthorized:
      description: "Token ausente, inválido, expirado ou revogado (AUTH_REQUIRED,\
        \ AUTH_TOKEN_INVALID, AUTH_TOKEN_EXPIRED, AUTH_TOKEN_REVOKED)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
          example:
            type: urn:forward:problem:auth-required
            title: Não autenticado
            status: 401
            detail: "Autenticação necessária. Envie o header Authorization: Bearer\
              \ <token>."
            instance: /api/v1/...
            code: AUTH_REQUIRED
            timestamp: 2026-09-27T12:00:00Z
            request_id: 5b0c7a4e-8f1d-4c1e-9a55-2f4d7e9b1c33
    Forbidden:
      description: Perfil sem permissão (ACCESS_DENIED) ou recurso de outra concessionária
        (ACCESS_OTHER_DEALER)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
          example:
            type: urn:forward:problem:access-other-dealer
            title: Acesso negado
            status: 403
            detail: Este recurso pertence a outra concessionária.
            instance: /api/v1/...
            code: ACCESS_OTHER_DEALER
            timestamp: 2026-09-27T12:00:00Z
            request_id: 5b0c7a4e-8f1d-4c1e-9a55-2f4d7e9b1c33
    NotFound:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
          example:
            type: urn:forward:problem:lead-not-found
            title: Recurso não encontrado
            status: 404
            detail: Lead não encontrado.
            instance: /api/v1/...
            code: LEAD_NOT_FOUND
            timestamp: 2026-09-27T12:00:00Z
            request_id: 5b0c7a4e-8f1d-4c1e-9a55-2f4d7e9b1c33
    Conflict:
