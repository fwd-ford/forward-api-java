name: DevSecOps

# Report-only security pipeline (SAST, SCA, secrets, IaC, container, SBOM).
# Findings land in Security > Code scanning; nothing here blocks a PR.
# Definition: https://github.com/fwd-ford/.github/blob/main/.github/workflows/devsecops.yml
# Spring Boot API: CodeQL java-kotlin, image scan of the production Dockerfile.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devsecops:
    name: DevSecOps
    uses: fwd-ford/.github/.github/workflows/devsecops.yml@ci/devsecops-maven-offline
    with:
      codeql-languages: '["java-kotlin","actions"]'
      semgrep-config: "p/default p/owasp-top-ten p/java p/dockerfile"
      dockerfile: Dockerfile
      docker-context: "."
      run-container-scan: true
