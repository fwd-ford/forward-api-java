# Render Blueprint (https://render.com/docs/blueprint-spec) for the ForwardService API.
#
# One Docker web service on the free plan. The database is the Supabase PostgreSQL project
# (region sa-east-1) reached through its Session pooler (IPv4, port 5432); Render has no
# IPv6 egress, so the direct db.<ref>.supabase.co host cannot be used. Do not use the
# transaction pooler (6543): it breaks prepared statements and Flyway's advisory lock.
#
# Deploy: render.com > New > Blueprint > repository fwd-ford/forward-api-java > fill in
# DATABASE_URL, DATABASE_USER and DATABASE_PASSWORD > Apply. See README "Deploy no Render".
services:
  - type: web
    name: forwardservice-api            # public URL: https://forwardservice-api.onrender.com
    runtime: docker
    plan: free
    region: virginia                    # closest Render region to Supabase sa-east-1
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Profile prod: Flyway baseline 13 on the forward-infra schema, V14+ and bootstrap data.
      - {key: SPRING_PROFILES_ACTIVE, value: prod}
      # production: JSON logs and JWT_SECRET mandatory (fail fast at startup).
      - {key: ENV, value: production}
      # Random 256-bit signing key generated by Render (stable across deploys).
      - {key: JWT_SECRET, generateValue: true}
      - {key: JWT_EXPIRATION_MINUTES, value: "60"}
      # Typed in the dashboard on the first deploy (sync: false):
      #   DATABASE_URL      jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
      #   DATABASE_USER     postgres.ysewoopjgdpvnkfhffgy
      #   DATABASE_PASSWORD Supabase database password
      - {key: DATABASE_URL, sync: false}
      - {key: DATABASE_USER, sync: false}
      - {key: DATABASE_PASSWORD, sync: false}
      - {key: DATABASE_POOL_SIZE, value: "5"}
      # Optional (security review F-18). Password of admin@forward.dev: the ADMIN is created
      # only when this is set (blank = no ADMIN). It is bcrypt-hashed by the database and never
      # logged. An existing admin@forward.dev that still has the published demo password is
      # rotated to this value, or deactivated when it is blank.
      - {key: ADMIN_BOOTSTRAP_PASSWORD, sync: false}
      # Optional, not declared here on purpose: DEMO_USERS_PASSWORD, the password of the
      # low-privilege demo users (gestor@, atendente@ and atendente2@forward.dev; dealer-scoped,
      # synthetic data). When absent the application uses the published Forward@2026, which the
      # professors and the mobile app ("Usar usuário de teste") rely on: accepted
      # demo-environment risk. To close it, add DEMO_USERS_PASSWORD in the dashboard
      # (Environment) before the first deploy; blank = no demo users. Existing users keep their
      # password when it changes. (A literal value here would violate the secrets policy and a
      # blank sync: false prompt could disable the demo users.)
      # - {key: DEMO_USERS_PASSWORD, sync: false}
      # X-API-Key for server-to-server calls (n8n), generated by Render.
      - {key: INTERNAL_API_KEY, generateValue: true}
      - {key: ALLOWED_ORIGINS, value: "https://expo.dev,https://expo.io,http://localhost:8081,http://127.0.0.1:8081,http://localhost:3000,http://localhost:5173"}
      # Client IP and https scheme from Render's proxy headers (Tomcat RemoteIpValve).
      - {key: FORWARD_HEADERS_STRATEGY, value: native}
      - {key: RATE_LIMIT_MAX, value: "120"}
      - {key: LOGIN_RATE_LIMIT_MAX, value: "10"}
      # JVM sized for 512 MB and a fast cold start (serial GC, C1 only).
      - {key: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=20 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:+ExitOnOutOfMemoryError"}
